name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_DIR: fcs-interview-code-assignment-main/java-assignment

jobs:
  test:
    name: Unit tests & coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ env.PROJECT_DIR }}/pom.xml

      - name: Make mvnw executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x ./mvnw

      - name: Run tests with coverage
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./mvnw -B verify

      - name: Debug - list target directory
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: find target -type d | sort

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: '${{ env.PROJECT_DIR }}/**/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: JaCoCo coverage summary
        id: jacoco
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: |
            ${{ github.workspace }}/${{ env.PROJECT_DIR }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          title: JaCoCo Coverage Report

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: ${{ env.PROJECT_DIR }}/target/site/jacoco/
          retention-days: 14

      - name: Fail if coverage below threshold
        if: steps.jacoco.outputs.coverage-overall < 80
        run: |
          echo "Coverage ${{ steps.jacoco.outputs.coverage-overall }}% is below the 80% threshold"
          exit 1